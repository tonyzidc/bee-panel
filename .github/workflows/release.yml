name: Release Bee Panel v2

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    name: Build Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev

      - name: Build release binary
        run: |
          cargo build --release
          mkdir -p bin
          cp target/release/bee-panel bin/bee-panel-linux-amd64
          ls -lh bin/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bee-panel-linux-amd64
          path: bin/bee-panel-linux-amd64

  publish:
    name: Publish GitHub Release
    needs: build-linux-x86_64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize release files
        run: |
          mkdir -p dist
          find artifacts -type f -name "bee-panel-linux-*" -exec cp {} dist/ \;
          cp scripts/install.sh dist/
          ls -lh dist/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
