name: Release Bee Panel

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build multi-arch binaries
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/bee-panel-linux-amd64 cmd/bee-panel/main.go
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o bin/bee-panel-linux-arm64 cmd/bee-panel/main.go
          ls -lh bin/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/bee-panel-linux-amd64
            bin/bee-panel-linux-arm64
            scripts/install.sh
            scripts/install-host-deps.sh
          generate_release_notes: true
