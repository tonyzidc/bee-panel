[package]
name = "bee-panel"
version = "2.0.0"
edition = "2021"
authors = ["Bee Panel Team"]
description = "Ultra-lightweight Native Rust Reverse Proxy & Linux OS Host Manager"
license = "MIT"

[dependencies]
# Async runtime & Web framework
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }

# Serialization & Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Database: Embedded SQLite with bundled C SQLite engine
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"

# Nginx Template Engine
minijinja = { version = "2", features = ["loader", "json"] }

# SSH Key generation (Ed25519 / RSA)
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "std", "alloc"] }
rand = "0.8"

# Security & Auth
argon2 = "0.5"
jsonwebtoken = "9"

# Embedded Web Assets
rust-embed = { version = "8", features = ["compression"] }

# System Monitoring & CLI
sysinfo = "0.31"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
mime_guess = "2.0"

# ACME SSL & Certificate generation
instant-acme = "0.7"
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
