<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8fb">
  <title>Bee Panel · Server control</title>
  <link rel="stylesheet" href="/tabler.min.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="auth-screen" class="auth-wrap">
    <div class="auth-card card">
      <div class="card-body p-4 p-md-5">
        <div class="brand brand-auth"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 20 7v10l-8 5-8-5V7z"/><path d="M8 9h8M8 12h8M8 15h8"/></svg></span><span>bee<span class="brand-light">panel</span></span></div>
        <h1 class="h2 mt-4 mb-1">Sign in to your panel</h1>
        <p class="text-secondary mb-4">Manage hosts, certificates and server access.</p>
        <form id="login-form">
          <div class="mb-3"><label class="form-label" for="login-user">Username</label><input class="form-control" id="login-user" name="username" autocomplete="username" required autofocus></div>
          <div class="mb-3"><label class="form-label" for="login-password">Password</label><input class="form-control" id="login-password" name="password" type="password" autocomplete="current-password" required></div>
          <p id="login-error" class="text-danger small" role="alert" hidden></p>
          <button class="btn btn-primary w-100" type="submit">Sign in</button>
        </form>
      </div>
    </div>
    <p class="text-secondary small mt-3">Bee Panel v2 · Native reverse proxy management</p>
  </div>

  <div id="app" class="app-shell" hidden>
    <aside id="sidebar" class="sidebar" aria-label="Main navigation">
      <div class="sidebar-head"><div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 20 7v10l-8 5-8-5V7z"/><path d="M8 9h8M8 12h8M8 15h8"/></svg></span><span>bee<span class="brand-light">panel</span></span></div><button id="close-sidebar" class="icon-btn mobile-only" aria-label="Close menu">×</button></div>
      <div class="sidebar-scroll">
        <div class="nav-label">Overview</div>
        <nav class="side-nav">
          <button data-tab="dashboard" class="side-link active"><span class="nav-icon" data-icon="dashboard"></span> Dashboard</button>
          <button data-tab="audit" class="side-link admin-only"><span class="nav-icon" data-icon="activity"></span> Activity log</button>
        </nav>
        <div class="nav-label">Traffic</div>
        <nav class="side-nav">
          <button data-tab="proxy-hosts" class="side-link"><span class="nav-icon" data-icon="world"></span> Proxy hosts</button>
          <button data-tab="redirections" class="side-link"><span class="nav-icon" data-icon="corner"></span> Redirections</button>
          <button data-tab="streams" class="side-link"><span class="nav-icon" data-icon="route"></span> Streams</button>
          <button data-tab="dead-hosts" class="side-link"><span class="nav-icon" data-icon="ban"></span> 404 hosts</button>
        </nav>
        <div class="nav-label">Security</div>
        <nav class="side-nav">
          <button data-tab="access-lists" class="side-link"><span class="nav-icon" data-icon="shield"></span> Access lists</button>
          <button data-tab="certificates" class="side-link"><span class="nav-icon" data-icon="lock"></span> Certificates</button>
          <button data-tab="users" class="side-link"><span class="nav-icon" data-icon="users"></span> Users & SSH</button>
        </nav>
      </div>
      <div class="sidebar-foot"><div class="server-indicator"><span id="server-dot" class="status-dot"></span><span id="server-name">Server status</span></div><span class="text-secondary small">v2.0</span></div>
    </aside>
    <div id="sidebar-scrim" class="sidebar-scrim" hidden></div>
    <div class="app-main">
      <header class="topbar">
        <div class="topbar-left"><button id="menu-button" class="icon-btn mobile-only" aria-label="Open menu"><span data-icon="menu"></span></button><span class="topbar-context">Bee Panel <span class="context-separator">/</span> <span id="topbar-section">Dashboard</span></span></div>
        <div class="topbar-right"><span id="topbar-time" class="text-secondary small desktop-only"></span><button id="theme-button" class="icon-btn" aria-label="Toggle dark mode"><span data-icon="moon"></span></button><span class="topbar-divider"></span><span id="account-avatar" class="avatar avatar-sm bg-blue-lt text-blue">A</span><span id="account-name" class="account-name">Admin</span><button id="password-button" class="icon-btn" aria-label="Change password" title="Change password"><span data-icon="lock"></span></button><button id="logout-button" class="icon-btn" aria-label="Sign out" title="Sign out"><span data-icon="logout"></span></button></div>
      </header>
      <main class="content-sheet" id="main-content">
        <div class="page-heading"><div><div class="eyebrow" id="page-eyebrow">Overview</div><h1 id="page-title">Dashboard</h1><p id="page-description" class="text-secondary mb-0"></p></div><div class="page-actions"><button id="refresh-button" class="btn btn-outline-secondary"><span data-icon="refresh"></span><span>Refresh</span></button><button id="add-button" class="btn btn-primary" hidden><span data-icon="plus"></span><span id="add-label">Add</span></button></div></div>
        <div id="page-content" aria-live="polite"></div>
      </main>
    </div>
  </div>

  <div id="modal-backdrop" class="modal-backdrop-custom" hidden>
    <div id="modal-panel" class="modal-panel card" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><div id="modal-kicker" class="eyebrow"></div><h2 id="modal-title" class="h3 mb-0"></h2></div><button id="modal-close" class="icon-btn" aria-label="Close dialog">×</button></div><div id="modal-body" class="modal-body-custom"></div></div>
  </div>
  <div id="toast-region" role="status" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
</html>
